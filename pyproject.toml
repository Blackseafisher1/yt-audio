[project]
name = "yt-audio"
version = "1.0.0"
description = "YouTube Audio/Video Batch Downloader"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.103.2",
    "pydantic<2",
    "uvicorn>=0.23,<0.30",
    "yt-dlp>=2024",
    "python-multipart>=0.0.6",
    "mutagen>=1.47",
]

[project.scripts]
yt-audio = "run:main"

[tool.setuptools]
py-modules = ["main", "run"]
